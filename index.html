<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>আগমনী</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

    <!-- =================================================
         HIDDEN YOUTUBE PLAYER
    ================================================== -->

    <div id="youtube-player"></div>


    <!-- =================================================
         BACKGROUND
    ================================================== -->

    <div class="background-overlay"></div>


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="top-bar">

        <!-- ONLINE -->
        <div class="online-pill">

            <span class="online-dot"></span>

            <span id="onlineCount">
                88 online
            </span>

        </div>


        <!-- COUNTDOWN -->
        <div class="countdown-pill">

            <span id="countdownText">
                64 days until Durga Pujo
            </span>

        </div>


        <!-- RIGHT BUTTONS -->
        <div class="top-actions">

            <!-- Music -->
            <button
                class="top-icon"
                id="topMusicButton"
                aria-label="Music">

                <span>▶</span>

            </button>


            <!-- Volume -->
            <button
                class="top-icon"
                id="topVolumeButton"
                aria-label="Volume">

                <span>🔊</span>

            </button>
            <button
            class="background-change-btn"
            id="backgroundChangeBtn"
            title="Change Background">

            ↻

        </button>


            <!-- Information -->
            <button
                class="top-icon"
                id="infoButton"
                aria-label="Information">

                <span class="people-icon">

                    <svg viewBox="0 0 64 64">
                        <circle cx="32" cy="20" r="8"></circle>

                        <path d="M17 48
                                 C17 37 23 31 32 31
                                 C41 31 47 37 47 48">
                        </path>

                        <circle cx="13" cy="27" r="5"></circle>

                        <path d="M4 49
                                 C4 41 8 37 14 37">
                        </path>

                        <circle cx="51" cy="27" r="5"></circle>

                        <path d="M60 49
                                 C60 41 56 37 50 37">
                        </path>
                    </svg>

                </span>

            </button>

        </div>

    </header>


    <!-- =================================================
         HERO
    ================================================== -->

    <main class="hero">

        <h1>
            আগমনী
        </h1>
        <p class="shubho-saradiya">
            শুভ শারদীয়া
        </p>


    </main>


    <!-- =================================================
         MUSIC AREA
    ================================================== -->

    <section class="music-section">

        <!-- PLAYLIST BUTTON -->
        <button
            class="playlist-selector"
            id="playlistSelector">

            <span id="playlistName">
                 PUJA PLAYLIST
            </span>

            <span class="selector-arrow">
               ⌄
            </span>

        </button>


        <!-- MUSIC PLAYER -->
        <div class="music-player">


            <!-- ALBUM -->
            <div class="album-art">

                <img
                    id="albumImage"
                    alt="Album artwork">

            </div>


            <!-- TRACK INFO -->
            <div class="track-info">

                <div
                    class="track-title"
                    id="trackTitle">

                    Dugga Elo

                </div>


                <div
                    class="track-artist"
                    id="trackArtist">

                    Monali Thakur and Guddu

                </div>


                <!-- PROGRESS -->
                <div class="progress-area">

                    <div
                        class="progress-bar"
                        id="progressBar">

                        <div
                            class="progress"
                            id="progress">
                        </div>

                    </div>


                    <div class="time-row">

                        <span id="currentTime">
                            0:00
                        </span>

                        <span id="totalTime">
                            0:00
                        </span>

                    </div>

                </div>

            </div>


            <!-- CONTROLS -->
            <div class="player-controls">

                <button
                    class="control-btn"
                    id="previousBtn">

                    |◀

                </button>


                <button
                    class="play-btn"
                    id="playBtn">

                    ▶

                </button>


                <button
                    class="control-btn"
                    id="nextBtn">

                    ▶|

                </button>

            </div>

        </div>

    </section>


    <!-- =================================================
         VOLUME PANEL
    ================================================== -->

    <div
        class="volume-panel"
        id="volumePanel">

        <div class="volume-title">
            VOLUME
        </div>

        <button
            class="volume-control"
            id="volumeDown">

            −

        </button>


        <div
            class="volume-value"
            id="volumeValue">

            100%

        </div>


        <button
            class="volume-control"
            id="volumeUp">

            +

        </button>
        

    </div>


    <!-- =================================================
         PLAYLIST MODAL
    ================================================== -->

    <div
        class="playlist-overlay"
        id="playlistOverlay">

        <div class="playlist-modal">


            <!-- HEADER -->
            <div class="playlist-header">

                <div class="playlist-heading">
                    PLAYLISTS
                </div>


                <button
                    class="close-btn"
                    id="closePlaylist">

                    ×

                </button>

            </div>


            <!-- TABS -->
            <div class="playlist-tabs">

                <button
                    class="playlist-tab active"
                    data-playlist="durga">

                    DURGA PUJA

                </button>


                <button
                    class="playlist-tab"
                    data-playlist="oldPuja">

                    OLD PUJA<br>PANDAL

                </button>


                <button
                    class="playlist-tab"
                    data-playlist="mahalayaSongs">

                    MAHALAYA<br>SONGS

                </button>

            </div>


            <!-- DESCRIPTION -->
            <div
                class="playlist-description"
                id="playlistDescription">

                The main curated Durga Puja playlist.

            </div>


            <!-- TRACK LIST -->
            <div
                class="track-list"
                id="trackList">

            </div>

        </div>

    </div>


    <!-- =================================================
         INFORMATION MODAL
    ================================================== -->

    <div
        class="info-overlay"
        id="infoOverlay">

        <div class="info-modal">


            <button
                class="info-close"
                id="closeInfo">

                ×

            </button>


            <div class="made-title">
                CRAFTED WITH LOVE & PUJO PREM BY
            </div>


            <div class="creator-card">


                <!-- PROFILE -->
                <div class="profile-photo">

                    <img
                        src="image/Amit.jpeg"
                        alt="Amit Thandar">

                </div>


                <div class="creator-name">
                    AMIT THANDAR
                </div>


                <div class="creator-role">
                    Developer & Creator
                </div>


                <!-- SOCIAL -->
                <div class="social-buttons">

                    <a
                        href="https://www.linkedin.com/in/amit-thandar"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn">

                        in

                    </a>


                   <a
                        href="https://www.instagram.com/amit_thandar_"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn">

                        <svg
                            viewBox="0 0 24 24"
                            width="25"
                            height="25"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="5"
                                ry="5">
                            </rect>

                            <circle
                                cx="12"
                                cy="12"
                                r="4">
                            </circle>

                            <circle
                                cx="17.5"
                                cy="6.5"
                                r="1">
                            </circle>

                        </svg>

                    </a>

                </div>

            </div>


            <div class="contact-divider"></div>


            <div class="contact-title">
                Want to get in touch?
            </div>


            <div class="contact-email">

                <span>
                    amitthandar240@gmail.com
                </span>


                <button
                    id="copyEmail">

                    COPY

                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         TOAST
    ================================================== -->

    <div
        class="toast"
        id="toast">

        Playlist loaded

    </div>


    <script src="script.js"></script>

</body>

</html>
